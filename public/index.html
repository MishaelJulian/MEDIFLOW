<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MediFlow — Hospital Patient & Appointment Management</title>
  <link rel="stylesheet" href="/css/styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220%22%20width=%22100%22%20height=%22100%22><text y=%22.9em%22 font-size=%2290%22>🏥</text></svg>">
</head>
<body>
  <!-- Demo Quick Switcher Bar -->
  <div class="demo-bar" id="demoBar">
    <div class="demo-bar-container">
      <div><strong>Demo Account Fast-Switch:</strong> (Single-click authentication for evaluation)</div>
      <div class="demo-pills">
        <button class="demo-btn" onclick="app.quickLogin('admin@mediflow.com', 'Admin@123')">🔑 Admin</button>
        <button class="demo-btn" onclick="app.quickLogin('dr.smith@mediflow.com', 'Doctor@123')">🩺 Dr. Smith (Cardiology)</button>
        <button class="demo-btn" onclick="app.quickLogin('dr.jones@mediflow.com', 'Doctor@123')">🧠 Dr. Jones (Neurology)</button>
        <button class="demo-btn" onclick="app.quickLogin('john.doe@example.com', 'Patient@123')">👤 Patient (John Doe)</button>
        <button class="demo-btn" onclick="app.quickLogin('receptionist@mediflow.com', 'Recep@123')">📋 Receptionist</button>
      </div>
    </div>
  </div>

  <!-- Header & Navigation -->
  <header class="app-header">
    <div class="header-container">
      <a href="#dashboard" class="brand" onclick="app.navigate('dashboard'); return false;">
        <div class="brand-icon">⚕️</div>
        <span>MediFlow</span>
      </a>

      <nav class="main-nav" id="mainNav">
        <!-- Injected dynamically based on role -->
      </nav>

      <div class="user-controls" id="userControls">
        <!-- Injected dynamically based on session -->
      </div>
    </div>
  </header>

  <!-- Main View Container -->
  <main class="main-content" id="app">
    <div class="spinner"></div>
  </main>

  <!-- Modals Container -->
  <div id="modalContainer"></div>

  <!-- Toasts / Notification Banners Container -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- Scripts -->
  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
